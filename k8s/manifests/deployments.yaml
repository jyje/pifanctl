# Single node, no Prometheus: one controller on one node, reading its own
# temperature. For a cluster (every node's temperature in Prometheus, fans that
# follow the hottest node) use the Helm chart in charts/pifanctl instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pifanctl
spec:
  selector:
    matchLabels:
      app: pifanctl
  strategy:
    # Never two controllers on one fan.
    type: Recreate
  template:
    metadata:
      labels:
        app: pifanctl
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: main
        image: ghcr.io/jyje/pifanctl:v1.0.0-alpha.1
        command: ["python", "main.py", "start"]
        env:
        - name: PIN
          value: "18"
        - name: LOG_LEVEL
          value: INFO
        - name: PWM_REFRESH_INTERVAL
          value: "5"
        - name: TEMP_LOW
          value: "50"
        - name: TEMP_HIGH
          value: "70"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          privileged: true
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: Exists
      #     effect: NoSchedule
      # nodeSelector:
      #   kubernetes.io/hostname: raspi-40 # change to your own hostname
