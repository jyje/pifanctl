# Native status checks define pass/fail; detailed results remain in Codecov.
# Keep complete PR reports visible and update one comment for each head.
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        flags:
          - python314
        informational: false
        if_not_found: failure
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
        flags:
          - python314
        informational: false
        if_not_found: failure
        if_ci_failed: error
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false
flags:
  python314:
    carryforward: false
