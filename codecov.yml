# Native status checks define pass/fail; detailed results remain in Codecov.
# Avoid summary comments that flag any partial line or badge-only base lag.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.1%
        flags:
          - python314
        informational: false
        if_not_found: failure
        if_ci_failed: error
    patch:
      default:
        target: 95%
        flags:
          - python314
        informational: false
        if_not_found: failure
        if_ci_failed: error
comment: false
flags:
  python314:
    carryforward: false
