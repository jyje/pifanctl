# Design proposal: replace example node names and verify physical wiring.
apiVersion: v1
kind: List
items:
- apiVersion: pifanctl.jyje.online/v1alpha1
  kind: Fan
  metadata:
    name: fan-pi-01
  spec:
    nodeName: pi-01
    hardware:
      rpigpio:
        pin: 18
        frequencyHz: 1000
    control:
      curve:
        temperatureLow: 50
        temperatureHigh: 70
        dutyIdle: 0
        dutyStart: 30
        dutyMax: 100
        dutyDownStep: 5
      refreshIntervalSeconds: 5
      failsafeDuty: 100
      exitDuty: 100
- apiVersion: pifanctl.jyje.online/v1alpha1
  kind: Fan
  metadata:
    name: fan-pi-02
  spec:
    nodeName: pi-02
    hardware:
      rpigpio:
        pin: 18
        frequencyHz: 1000
    control:
      curve:
        temperatureLow: 50
        temperatureHigh: 70
        dutyIdle: 0
        dutyStart: 30
        dutyMax: 100
        dutyDownStep: 5
      refreshIntervalSeconds: 5
      failsafeDuty: 100
      exitDuty: 100
- apiVersion: pifanctl.jyje.online/v1alpha1
  kind: CoolingZone
  metadata:
    name: pi-01
  spec:
    fanRefs:
    - fan-pi-01
    telemetry:
      source: prometheus
      prometheusURL: http://prometheus-operated.monitoring.svc:9090
      maxSampleAgeSeconds: 30
    nodeNames:
    - pi-01
- apiVersion: pifanctl.jyje.online/v1alpha1
  kind: CoolingZone
  metadata:
    name: pi-02
  spec:
    fanRefs:
    - fan-pi-02
    telemetry:
      source: prometheus
      prometheusURL: http://prometheus-operated.monitoring.svc:9090
      maxSampleAgeSeconds: 30
    nodeNames:
    - pi-02
