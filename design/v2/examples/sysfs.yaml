# Design proposal: verify the kernel PWM overlay and physical channel first.
apiVersion: v1
kind: List
items:
  - apiVersion: pifanctl.jyje.online/v1alpha1
    kind: Fan
    metadata:
      name: pi5-fan
    spec:
      nodeName: pi-05
      hardware:
        sysfs:
          chip: 0
          channel: 2
          frequencyHz: 1000
  - apiVersion: pifanctl.jyje.online/v1alpha1
    kind: CoolingZone
    metadata:
      name: pi5-board
    spec:
      nodeNames: [pi-05]
      fanRefs: [pi5-fan]
      telemetry:
        source: local
