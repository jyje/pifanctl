# Design proposal: replace example node names and verify physical wiring.
apiVersion: v1
kind: List
items:
- apiVersion: pifanctl.jyje.online/v1
  kind: Fan
  metadata:
    name: local-fan
  spec:
    nodeName: pi-01
    hardware:
      rpigpio:
        pin: 18
        frequencyHz: 1000
    control:
      curve:
        temperatureLow: 50
        temperatureHigh: 70
        dutyIdle: 0
        dutyStart: 30
        dutyMax: 100
        dutyDownStep: 5
      refreshIntervalSeconds: 5
      failsafeDuty: 100
      exitDuty: 100
- apiVersion: pifanctl.jyje.online/v1
  kind: CoolingZone
  metadata:
    name: local-board
  spec:
    fanRefs:
    - local-fan
    telemetry:
      source: local
    nodeNames:
    - pi-01
