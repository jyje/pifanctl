name: build-image-main

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - .github/workflows/build-image-main.yaml
      - .github/workflows/_build-image.yaml
      - docker/all.dockerfile
      - docker/raspi.dockerfile
      - sources/**

concurrency:
  group: build-image-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A commit message containing --no-ci skips the build. The message is read by
  # the workflow engine, never interpolated into a shell script.
  build:
    if: ${{ !contains(github.event.head_commit.message, '--no-ci') }}
    uses: ./.github/workflows/_build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      image-suffix: ""
      tag-latest: true
      tag-release: true

  build-compatibility:
    if: ${{ !contains(github.event.head_commit.message, '--no-ci') }}
    uses: ./.github/workflows/_build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      image-suffix: ""
      python-version: '3.12'
      tag-latest: false
      tag-release: true

  # Tag and release the version this commit carries, after its image exists.
  # Idempotent: it does nothing when the release is already there.
  release:
    needs: [build, build-compatibility]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-compatibility.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release the application version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.sh app
