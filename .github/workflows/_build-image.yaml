name: _build-image

# Reusable: build the ARM64 image on the in-cluster ARC runner, test it, and
# publish it. Called by build-image-{main,develop,issue}.yaml.

on:
  workflow_call:
    inputs:
      image-suffix:
        description: Package name suffix, for example "-dev"
        type: string
        default: ""
      python-version:
        description: Supported Python runtime; alternate runtimes use distinct experimental tags
        type: string
        default: '3.14'
      tag-latest:
        description: Also publish the `latest` tag
        type: boolean
        default: false
      tag-release:
        description: Also publish v<version> once, if that tag does not exist yet
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-testing:
    name: 🏗️ Build and testing
    runs-on:
      labels: r4spi-microk8s # Self-hosted ARM64 runner (ARC)
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ inputs.image-suffix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          TAG_LATEST: ${{ inputs.tag-latest }}
          TAG_RELEASE: ${{ inputs.tag-release }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          case "${PYTHON_VERSION}" in
            3.10|3.11|3.12|3.13|3.14) ;;
            *) echo 'unsupported Python runtime' >&2; exit 1 ;;
          esac
          short_sha="${GITHUB_SHA::7}"
          if [ "${PYTHON_VERSION}" != '3.14' ]; then
            if [ "${TAG_LATEST}" = true ] || [ "${TAG_RELEASE}" = true ]; then
              echo 'alternate runtimes are experimental and cannot publish release/latest tags' >&2
              exit 1
            fi
            short_sha="${short_sha}-py${PYTHON_VERSION//./}"
          fi
          echo "${short_sha}" > ./sources/version
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sources/pifanctl/__init__.py)"
          {
            echo "short_sha=${short_sha}"
            echo "version=${version}"
            echo "tags<<EOF"
            SHORT_SHA="${short_sha}" VERSION="${version}" ./scripts/image-tags.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build/Publish as GitHub Package
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/all.dockerfile
          platforms: linux/arm64
          build-args: PYTHON_VERSION=${{ inputs.python-version }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}

      - name: Test image default
        run: docker run --rm -i "${IMAGE}:${{ steps.tags.outputs.short_sha }}"

      - name: Test image version
        run: |
          version="$(docker run --rm "${IMAGE}:${{ steps.tags.outputs.short_sha }}" python main.py --version)"
          test "${version}" = "${{ steps.tags.outputs.version }} (${{ steps.tags.outputs.short_sha }})"

      - name: Test image runs unprivileged and refuses to fake hardware
        run: |
          image="${IMAGE}:${{ steps.tags.outputs.short_sha }}"
          test "$(docker run --rm "${image}" id -u)" != "0"
          docker run --rm "${image}" python -m pifanctl.hardware_smoke
