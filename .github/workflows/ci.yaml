name: ci

# Checks pull requests and main, then publishes only trusted coverage badges.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "assets/coverage/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: 🏷️ Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a new version when the application or the chart changes
        run: python3 scripts/check_version_bump.py "origin/${{ github.base_ref }}"

  workflows:
    name: 🔎 Workflows
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Validate pending v1 release changesets
        run: python3 scripts/check_changesets.py

  test:
    name: 🧪 Test (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Test every stable Python minor release from the minimum supported version.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sources/requirements.*.txt
      - uses: azure/setup-helm@v5
      - name: Install dependencies
        run: pip install -r sources/requirements.dev.txt
      - name: Run tests with coverage
        run: >-
          python -m pytest --cov=sources --cov-config=.coveragerc --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json --cov-report=html:coverage-html
      - name: Validate branch report and enforce the line floor
        run: >-
          python scripts/coverage_metrics.py report --report coverage.json
          --python "${{ matrix.python }}" --sha "${{ github.sha }}"
          --manifest coverage-manifest.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve the version-specific reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.python }}
          path: |
            coverage.json
            coverage.xml
            coverage-manifest.json
            coverage-html/
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}
          if-no-files-found: warn

  coverage:
    name: Coverage quality
    needs: [test]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Download every Python coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
      - name: Check report identities, matrix completeness, and line floor
        run: python scripts/coverage_metrics.py matrix --directory coverage-artifacts --sha "${{ github.sha }}" --summary "$GITHUB_STEP_SUMMARY"

  codecov:
    name: Codecov report
    needs: [coverage]
    if: >-
      needs.coverage.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download canonical Python 3.14 coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-3.14
          path: coverage-canonical
      - name: Upload the canonical report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-canonical/coverage.xml
          disable_search: true
          flags: python314
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  publish-badges:
    name: Publish main coverage badges
    needs: [workflows, test, chart, coverage]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.workflows.result == 'success' && needs.test.result == 'success' &&
      needs.chart.result == 'success' && needs.coverage.result == 'success'
    runs-on: ubuntu-26.04
    concurrency:
      group: coverage-badge-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download canonical Python 3.14 coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-3.14
          path: coverage-canonical
      - name: Render line and branch SVG badges with measurement metadata
        run: python scripts/coverage_metrics.py badges --manifest coverage-canonical/coverage-manifest.json --output assets/coverage
      - name: Publish only if this commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Main advanced after this run; keep the existing badge measurement.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/coverage/lines.svg assets/coverage/branches.svg assets/coverage/metadata.json
          if git diff --cached --quiet; then
            echo 'Coverage badge contents are unchanged.'
            exit 0
          fi
          git commit -m 'ci(coverage): publish main badges'
          git push origin HEAD:main

  chart:
    name: ⎈ Chart
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint with every set of values
        run: |
          helm lint charts/pifanctl-operator
          helm lint charts/pifanctl-operator --set agent.mode=reuse
          helm lint charts/pifanctl-operator -f tests/fixtures/operator-extra-resources.yaml
          helm lint design/v1/helm -f design/v1/examples/helm-values.yaml
          helm lint charts/pifanctl
          for values in charts/pifanctl/ci/*.yaml; do
            helm lint charts/pifanctl -f "$values"
          done
      - name: Validate rendered manifests against Kubernetes and CRD schemas
        run: |
          helm template ci charts/pifanctl-operator -n pifanctl \
            | docker run -i --rm ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
                -kubernetes-version 1.33.0 -schema-location default
          for values in charts/pifanctl/ci/*.yaml; do
            echo "::group::$values"
            helm template ci charts/pifanctl -n pifanctl -f "$values" \
              | docker run -i --rm ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
                  -kubernetes-version 1.33.0 -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
      - name: Validate alert rules with promtool
        run: |
          helm template ci charts/pifanctl -n pifanctl -f charts/pifanctl/ci/prometheus-values.yaml \
            | python3 -c "
          import sys, yaml
          for doc in yaml.safe_load_all(sys.stdin):
              if doc and doc['kind'] == 'PrometheusRule':
                  yaml.safe_dump({'groups': doc['spec']['groups']}, open('rules.yaml', 'w'))
          "
          docker run --rm -v "$PWD/rules.yaml:/rules.yaml" --entrypoint promtool prom/prometheus:v3.15.0 check rules /rules.yaml

  image:
    name: 🐳 Image (ARM64, in-cluster runner)
    # Self-hosted runners never run code from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      labels: r4spi-microk8s
    steps:
      - uses: actions/checkout@v7
      - name: Build without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/all.dockerfile
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: pifanctl:ci
      - name: Smoke test
        run: |
          docker run --rm pifanctl:ci python main.py --help
          docker run --rm pifanctl:ci python main.py topology --help
          docker run --rm pifanctl:ci python main.py worker --help
          docker run --rm pifanctl:ci python main.py operator --help
          test "$(docker run --rm pifanctl:ci id -u)" != "0"
          docker run --rm pifanctl:ci python -m pifanctl.hardware_smoke
