name: ci

# Checks every pull request before merge. Nothing here publishes anything.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: 🏷️ Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a new version when the application or the chart changes
        run: python3 scripts/check_version_bump.py "origin/${{ github.base_ref }}"

  workflows:
    name: 🔎 Workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  test:
    name: 🧪 Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Test every stable Python minor release from the minimum supported version.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sources/requirements.*.txt
      - uses: azure/setup-helm@v5
      - name: Install dependencies
        run: pip install -r sources/requirements.dev.txt
      - name: Run tests with coverage
        run: python -m pytest --cov=sources --cov-report=term-missing --cov-fail-under=90

  chart:
    name: ⎈ Chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint with every set of values
        run: |
          helm lint charts/pifanctl-operator
          helm lint charts/pifanctl-operator --set input.mode=configMap,input.configMapName=topology,agent.mode=reuse
          helm lint design/v1/helm -f design/v1/examples/helm-values.yaml
          helm lint charts/pifanctl
          for values in charts/pifanctl/ci/*.yaml; do
            helm lint charts/pifanctl -f "$values"
          done
      - name: Validate rendered manifests against Kubernetes and CRD schemas
        run: |
          for mode in crd configMap; do
            helm template ci charts/pifanctl-operator -n pifanctl --set input.mode="$mode",input.configMapName=topology \
              | docker run -i --rm ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
                  -kubernetes-version 1.33.0 -schema-location default
          done
          for values in charts/pifanctl/ci/*.yaml; do
            echo "::group::$values"
            helm template ci charts/pifanctl -n pifanctl -f "$values" \
              | docker run -i --rm ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
                  -kubernetes-version 1.33.0 -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
      - name: Validate alert rules with promtool
        run: |
          helm template ci charts/pifanctl -n pifanctl -f charts/pifanctl/ci/prometheus-values.yaml \
            | python3 -c "
          import sys, yaml
          for doc in yaml.safe_load_all(sys.stdin):
              if doc and doc['kind'] == 'PrometheusRule':
                  yaml.safe_dump({'groups': doc['spec']['groups']}, open('rules.yaml', 'w'))
          "
          docker run --rm -v "$PWD/rules.yaml:/rules.yaml" --entrypoint promtool prom/prometheus:v3.15.0 check rules /rules.yaml

  image:
    name: 🐳 Image (ARM64, in-cluster runner)
    # Self-hosted runners never run code from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      labels: r4spi-microk8s
    steps:
      - uses: actions/checkout@v7
      - name: Build without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/all.dockerfile
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: pifanctl:ci
      - name: Smoke test
        run: |
          docker run --rm pifanctl:ci python main.py --help
          docker run --rm pifanctl:ci python main.py topology --help
          docker run --rm pifanctl:ci python main.py worker --help
          docker run --rm pifanctl:ci python main.py operator --help
          test "$(docker run --rm pifanctl:ci id -u)" != "0"
          if docker run --rm pifanctl:ci python main.py start --driver rpigpio; then
            echo "the real GPIO driver must fail when there is no GPIO" >&2
            exit 1
          fi
