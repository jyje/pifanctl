name: release-chart

# Publishes the single supported v1 operator chart as an OCI artifact:
#   helm install pifanctl oci://ghcr.io/jyje/charts/pifanctl-operator --version <version>

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - charts/pifanctl-operator/**
      - .github/workflows/release-chart.yaml

concurrency:
  group: release-chart
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    env:
      CHART_NAME: pifanctl-operator
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Wait for the image version pinned by the chart
        # appVersion is an independently maintained default image pointer.
        run: |
          version="$(helm show chart "charts/${CHART_NAME}" | sed -n 's/^appVersion: //p' | tr -d '"')"
          image="ghcr.io/${GITHUB_REPOSITORY}:v${version}"
          for attempt in $(seq 1 40); do
            if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
              echo "${image} exists"
              exit 0
            fi
            echo "waiting for ${image} (${attempt}/40)"
            sleep 15
          done
          echo "::error::${image} was not published, so the chart that uses it is not released"
          exit 1
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Package and push a new version
        run: |
          version="$(helm show chart "charts/${CHART_NAME}" | sed -n 's/^version: //p')"
          ref="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${CHART_NAME}"
          if helm show chart "${ref}" --version "${version}" >/dev/null 2>&1; then
            echo "::notice::chart ${version} is already published, nothing to do"
            exit 0
          fi
          helm package "charts/${CHART_NAME}" --destination dist
          helm push "dist/${CHART_NAME}-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
      - name: Tag and release the chart version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.sh chart
