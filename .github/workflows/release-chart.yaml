name: release-chart

# Publishes the chart as an OCI artifact when charts/pifanctl/Chart.yaml gets a
# version that has not been published yet:
#   helm install pifanctl oci://ghcr.io/jyje/charts/pifanctl --version <version>

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - charts/pifanctl/**
      - charts/pifanctl-operator/**
      - .github/workflows/release-chart.yaml

concurrency:
  group: release-chart
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    strategy:
      matrix:
        chart: [pifanctl, pifanctl-operator]
    env:
      CHART_NAME: ${{ matrix.chart }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Wait for the image the chart points at
        # A new application version changes the chart's default image tag. The
        # image is built by build-image-main, which can still be running.
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sources/pifanctl/__init__.py)"
          image="ghcr.io/${GITHUB_REPOSITORY}:v${version}"
          for attempt in $(seq 1 40); do
            if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
              echo "${image} exists"
              exit 0
            fi
            echo "waiting for ${image} (${attempt}/40)"
            sleep 15
          done
          echo "::error::${image} was not published, so the chart that uses it is not released"
          exit 1
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Package and push a new version
        run: |
          version="$(helm show chart "charts/${CHART_NAME}" | sed -n 's/^version: //p')"
          ref="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${CHART_NAME}"
          if helm show chart "${ref}" --version "${version}" >/dev/null 2>&1; then
            echo "::notice::chart ${version} is already published, nothing to do"
            exit 0
          fi
          helm package "charts/${CHART_NAME}" --destination dist
          helm push "dist/${CHART_NAME}-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
      - name: Tag and release the chart version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.sh chart
