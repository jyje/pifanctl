apiVersion: v1
kind: Service
metadata:
  name: {{ include "pifanctl.operatorName" . }}-worker
  labels:
    {{- include "pifanctl.operatorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  # Keep safety metrics visible when regulation readiness is false.
  publishNotReadyAddresses: true
  selector:
    pifanctl.jyje.online/operator: {{ .Values.operatorId | quote }}
    app.kubernetes.io/component: worker
  ports:
    - {name: metrics, port: 9103, targetPort: status}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pifanctl.operatorName" . }}-worker
  labels:
    {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
