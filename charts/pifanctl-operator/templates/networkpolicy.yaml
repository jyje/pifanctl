{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pifanctl.operatorName" . }}-worker
spec:
  podSelector:
    matchLabels:
      pifanctl.jyje.online/operator: {{ .Values.operatorId | quote }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              pifanctl.jyje.online/operator: {{ .Values.operatorId | quote }}
              app.kubernetes.io/component: operator
      ports: [{protocol: TCP, port: 9103}]
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 14 }}
      ports: [{protocol: TCP, port: 9103}]
{{- end }}
