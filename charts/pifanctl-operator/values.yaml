# Use a short, unique installation identity. CRs cannot be shared by operators.
operatorId: pifanctl
# Leader-only readiness: one operator is the supported deployment shape.
replicas: 1
image:
  repository: ghcr.io/jyje/pifanctl
  # Empty uses v<appVersion>; chart version and appVersion follow the app release.
  tag: ""
  pullPolicy: IfNotPresent
agent:
  # managed creates temperature agents; reuse requires the v1 freshness metric.
  mode: managed
  interval: 5
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
networkPolicy:
  enabled: true
  # Set to the namespace labels of your Prometheus installation.
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
serviceMonitor:
  enabled: false
  labels: {}
  interval: 10s
# -- Additional Kubernetes resources rendered with this release. Use this for
# Fan and CoolingZone custom resources so GitOps owns runtime instances beside
# the operator installation.
# Existing Fan/CoolingZone values remain valid: feedback is optional and off
# when absent. Add this block inside a Fan spec only after verifying wiring:
# feedback:
#   tachometer:
#     gpio:
#       pin: 23                    # BCM GPIO23, physical header pin 16
#       pull: up                   # Internal 3.3 V bias: off (default), up, down
#     pulsesPerRevolution: 2       # NF-A12x25 PWM tach output: two pulses/rev
#     sampleSeconds: 5             # Rolling observation window, 1-60 seconds
# Pi 4 / rpigpio only, Linux GPIO v2 required. Use a distinct input pin.
# Verify an open-collector signal without a 5 V / 12 V pull-up before enabling.
# RPM feedback is observational; PWM duty, frequency and failsafe stay unchanged.
# Existing Helm installations must apply updated CRDs before using feedback.
extraResources: []
