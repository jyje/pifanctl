apiVersion: v2
name: pifanctl
description: >-
  PWM fan control for Raspberry Pi clusters. An agent on every node publishes
  temperatures to Prometheus, and a controller drives each fan from the hottest
  node.
type: application
version: 0.1.0
appVersion: "0.2.0"
home: https://github.com/jyje/pifanctl
sources:
  - https://github.com/jyje/pifanctl
keywords:
  - raspberry-pi
  - fan
  - pwm
  - prometheus
maintainers:
  - name: jyje
    url: https://github.com/jyje
